name: Local Beta feedback
description: Synthetic-data-only local Beta feedback
title: "[Beta] "
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: No real customer data, credentials, tokens, cookies, env, state files, or raw configuration are included.
          required: true
  - type: input
    id: artifact
    attributes:
      label: Candidate version and ZIP SHA-256
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows build, Node/npm and browser versions
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction, expected and actual result
    validations:
      required: true
  - type: input
    id: code
    attributes:
      label: Safe command result code
