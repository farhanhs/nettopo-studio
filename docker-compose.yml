services:
  postgres:
    image: postgres:17-alpine
    container_name: nettopo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nettopo_studio
      POSTGRES_USER: nettopo
      POSTGRES_PASSWORD: nettopo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - nettopo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nettopo -d nettopo_studio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nettopo-postgres-data:
